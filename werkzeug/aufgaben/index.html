const MERKER = "aufgaben.zugang";

let arbeiterFertig = Promise.resolve();
if ("serviceWorker" in navigator) {
  arbeiterFertig = navigator.serviceWorker.register("sw.js").catch(() => {});
}

const roh = t => Uint8Array.from(atob(t), z => z.charCodeAt(0));

async function schluessel(passwort) {
  const stoff = await crypto.subtle.importKey("raw", new TextEncoder().encode(passwort),
    "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: roh(PAKET.salz), iterations: Number(PAKET.runden), hash: "SHA-256" },
    stoff, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}

async function oeffnen(passwort) {
  const k = await schluessel(passwort);
  const klar = await crypto.subtle.decrypt({ name: "AES-GCM", iv: roh(PAKET.nonce) }, k,
                                           roh(PAKET.inhalt));
  const seite = new TextDecoder("utf-8").decode(klar);
  try { localStorage.setItem(MERKER, passwort); } catch (e) { /* privater Modus */ }
  /* Auf die Anmeldung warten, aber nicht auf sie hoffen: Drei Sekunden Deckel, damit ein
     Browser ohne Dienst-Arbeiter oder ein hakendes Netz die Seite nicht aufhaelt. */
  try { await Promise.race([arbeiterFertig, new Promise(f => setTimeout(f, 3000))]); }
  catch (e) { /* ohne Dienst-Arbeiter laeuft alles weiter, nur nicht ohne Netz */ }
  /* Dieselbe Adresse behalten, statt auf eine Blob-Adresse zu springen: Nur so zeigt das
     Symbol auf dem Startbildschirm weiter hierher. */
  document.open();
  document.write(seite);
  document.close();
}

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const feld = document.getElementById("pw");
  const hinweis = document.getElementById("fehler");
  document.getElementById("knopf").disabled = true;
  hinweis.textContent = "Einen Augenblick \u2026";
  try {
    await oeffnen(feld.value.trim());
  } catch (fehler) {
    hinweis.textContent = "Das Passwort stimmt nicht.";
    document.getElementById("knopf").disabled = false;
    feld.select();
  }
});

/* Zweites und jedes weitere Oeffnen laeuft ohne Eingabe durch -- sonst waere das Symbol auf
   dem Startbildschirm eine Passwortabfrage und keine Uebersicht. */
(async () => {
  let gemerkt = null;
  try { gemerkt = localStorage.getItem(MERKER); } catch (e) { gemerkt = null; }
  if (!gemerkt) return;
  try { await oeffnen(gemerkt); }
  catch (fehler) { try { localStorage.removeItem(MERKER); } catch (e) { /* egal */ } }
})();
</script>
